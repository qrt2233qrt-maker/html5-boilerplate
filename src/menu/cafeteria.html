    ===================== HOW TO EDIT THIS MENU =====================
    Everything on the menu is in the MENU list below.
    - Change a price:   edit the number after price:
    - Rename an item:   edit the text after name:
    - Add an item:      copy a line like { name: '...', price: 1000 },
    - Remove an item:   delete its line
    - Add a note under an item: add  note: '...'  to that line

  -->
