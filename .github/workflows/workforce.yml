name: Workforce

on:
  push:
    paths: ["workforce/**", ".github/workflows/workforce.yml", "eslint.config.mjs"]
  pull_request:
    paths: ["workforce/**", ".github/workflows/workforce.yml", "eslint.config.mjs"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: workforce_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/workforce_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Lint
        run: npm ci && npx eslint workforce
      - name: Test
        working-directory: workforce
        run: npm ci && npm test
