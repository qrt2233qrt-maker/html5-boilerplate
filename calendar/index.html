<title>Cozy Calendar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Fredoka:wght@500;600&family=Inter:wght@400;600;700&family=Manrope:wght@400;600;700;800&family=Nunito:wght@400;600;700&family=Space+Grotesk:wght@500;600&display=swap">
<link rel="stylesheet" href="css/app.css">

<div id="bg" aria-hidden="true">
  <div id="bg-media" hidden><div class="bg-ph"></div><div class="bg-ph"></div></div>
  <div id="bg-clouds" hidden><div class="bg-ph on"></div></div>
  <div id="bg-dim"></div>
</div>
<div id="splash" aria-hidden="true"><i></i></div>

<div class="shell">
  <nav id="nav" class="glass" aria-label="Sections"></nav>
  <div class="main">
    <header class="bar glass" id="bar"></header>
    <div id="tray" class="glass" role="region" aria-label="Reminders" hidden></div>
    <main id="view" class="col" style="gap:12px"></main>
  </div>
</div>

<button id="fab" type="button" aria-label="Add something"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="focus" hidden></div>
<div id="cheer" role="status" hidden></div>
<div class="modal" id="modal"></div>
<div class="modal" id="confirm"></div>
<div id="menu" class="glass" role="menu" hidden></div>
<div id="toast" role="status" hidden></div>
<input class="vh" type="file" id="file-in" multiple tabindex="-1" aria-label="Choose files">

<script src="js/core.js"></script>
<script src="js/ui.js"></script>
<script src="js/remind.js"></script>
<script src="js/views.js"></script>
<script src="js/editor.js"></script>
<script src="js/extras.js"></script>
<script src="js/app.js"></script>
