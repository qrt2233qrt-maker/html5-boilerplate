<title>Cozy Calendar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: a photo-topped month page, like a wall calendar. Phone: one column, the day opens as a full sheet.
   Wide screens: month on the left, the chosen day pinned on the right. */
:root {
  --bg: #fdf5f8; --surface: #ffffff; --surface-2: #f8e8f0; --ink: #4a3b52; --muted: #85728d; --line: #eed9e5;
  --accent: #f7a8c8; --on-accent: #3d2a3f;
  --c-appt: #d9609a; --c-task: #7a74e0; --c-rem: #d98324; --c-note: #3aa583; --late: #c9455f;
  --shadow: 0 6px 20px rgba(120, 80, 110, .12);
  --display: "Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Nunito", "Avenir Next", "Segoe UI", sans-serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #211a20; --surface: #2c232b; --surface-2: #3a2e37; --ink: #f6e9dc; --muted: #bba6ab; --line: #4b3c47;
    --accent: #f2b872;
    --c-appt: #f7a8c8; --c-task: #b9b5ff; --c-rem: #f7c98a; --c-note: #9fe0c8; --late: #ff9aa8;
    --shadow: 0 6px 20px rgba(0, 0, 0, .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #211a20; --surface: #2c232b; --surface-2: #3a2e37; --ink: #f6e9dc; --muted: #bba6ab; --line: #4b3c47;
  --accent: #f2b872;
  --c-appt: #f7a8c8; --c-task: #b9b5ff; --c-rem: #f7c98a; --c-note: #9fe0c8; --late: #ff9aa8;
  --shadow: 0 6px 20px rgba(0, 0, 0, .35); color-scheme: dark;
}
/* Looks chosen in Settings win over the device theme. */
:root[data-look="pastel"] {
  --bg: #fdf5f8; --surface: #ffffff; --surface-2: #f8e8f0; --ink: #4a3b52; --muted: #85728d; --line: #eed9e5;
  --accent: #f7a8c8;
  --c-appt: #d9609a; --c-task: #7a74e0; --c-rem: #d98324; --c-note: #3aa583; --late: #c9455f;
  --shadow: 0 6px 20px rgba(120, 80, 110, .12); color-scheme: light;
}
:root[data-look="cozy"] {
  --bg: #211a20; --surface: #2c232b; --surface-2: #3a2e37; --ink: #f6e9dc; --muted: #bba6ab; --line: #4b3c47;
  --accent: #f2b872;
  --c-appt: #f7a8c8; --c-task: #b9b5ff; --c-rem: #f7c98a; --c-note: #9fe0c8; --late: #ff9aa8;
  --shadow: 0 6px 20px rgba(0, 0, 0, .35); color-scheme: dark;
}
:root[data-look="mix"] {
  --bg: #201c2e; --surface: #2b2640; --surface-2: #383152; --ink: #f4eeff; --muted: #b4a9d1; --line: #474066;
  --accent: #f7a8c8;
  --c-appt: #f7a8c8; --c-task: #b9b5ff; --c-rem: #f7c98a; --c-note: #9fe0c8; --late: #ff9aa8;
  --shadow: 0 6px 20px rgba(0, 0, 0, .35); color-scheme: dark;
}

html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font: 16px/1.45 var(--body);
  padding-block: 14px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
* { box-sizing: border-box; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; }
.app { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.top h1 { font-size: 1.5rem; min-width: 0; overflow-wrap: anywhere; }
.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 999px; }
.tabs button { border: 0; background: transparent; padding: 7px 13px; border-radius: 999px; font-weight: 700; color: var(--muted); font-size: .9rem; }
.tabs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

.btn { border: 1.5px solid var(--line); background: var(--surface); padding: 9px 15px; border-radius: 999px; font-weight: 700; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.small { padding: 6px 12px; font-size: .85rem; }
.btn.danger { color: var(--late); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.muted { color: var(--muted); }
.hint { color: var(--muted); font-size: .85rem; margin: 0; }

/* month page */
.cal-layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.cal-main { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.hero { position: relative; height: clamp(170px, 44vw, 290px); border-radius: var(--r); overflow: hidden; background: var(--surface-2); box-shadow: var(--shadow); }
.hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero-scrim { position: absolute; inset: 0; background: linear-gradient(to top, rgba(30, 18, 30, .62), rgba(30, 18, 30, 0) 58%); }
.hero-text { position: absolute; left: 16px; bottom: 12px; color: #fff; text-shadow: 0 1px 6px rgba(0, 0, 0, .35); }
.hero-text span { font-weight: 700; letter-spacing: .08em; font-size: .8rem; }
.hero-text h2 { font-size: clamp(1.9rem, 7vw, 2.8rem); line-height: 1; }
.hero-actions { position: absolute; right: 10px; top: 10px; display: flex; gap: 6px; }
.on-photo { border: 0; background: rgba(255, 255, 255, .88); color: #3d2a3f; padding: 6px 12px; border-radius: 999px; font-weight: 700; font-size: .82rem; }
.month-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.round { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); font-size: 1.2rem; line-height: 1; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.wd { text-align: center; font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-bottom: 2px; }
.cell { aspect-ratio: 1; max-height: 86px; width: 100%; border: 1.5px solid transparent; background: var(--surface); border-radius: 14px; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; font-weight: 700; font-variant-numeric: tabular-nums; }
.cell.today { border-color: var(--accent); }
.cell.sel { background: var(--accent); color: var(--on-accent); }
.cell.sel .dot { box-shadow: 0 0 0 1.5px var(--on-accent); }
.dots { display: flex; gap: 3px; min-height: 7px; }
.dot { width: 7px; height: 7px; border-radius: 50%; }
.t-appt { --c: var(--c-appt); } .t-task { --c: var(--c-task); } .t-rem { --c: var(--c-rem); } .t-note { --c: var(--c-note); }
.dot { background: var(--c); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .8rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }

/* day panel */
.day { display: none; flex-direction: column; gap: 12px; min-width: 0; }
.day.open { display: flex; position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto;
  padding: calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.day-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.day-head h2 { font-size: 1.3rem; }
.day-photo { position: relative; height: clamp(180px, 50vw, 260px); border-radius: var(--r); overflow: hidden; background: var(--surface-2); box-shadow: var(--shadow); flex: none; }
.day-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.day-photo .hero-actions { top: auto; bottom: 10px; right: 10px; flex-wrap: wrap; justify-content: flex-end; }
.items { display: flex; flex-direction: column; gap: 8px; list-style: none; margin: 0; padding: 0; }
.item { display: flex; gap: 10px; align-items: flex-start; background: var(--surface); border: 1.5px solid var(--line); border-left: 5px solid var(--c); border-radius: 14px; padding: 10px 12px; }
.item-main { flex: 1; min-width: 0; border: 0; background: transparent; text-align: left; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.item-title { font-weight: 700; overflow-wrap: anywhere; }
.item.done .item-title { text-decoration: line-through; color: var(--muted); }
.item-meta { font-size: .82rem; color: var(--muted); overflow-wrap: anywhere; }
.item-meta .late { color: var(--late); font-weight: 700; }
.tag { font-size: .68rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--c); }
.eg { font-size: .68rem; font-weight: 700; border: 1px dashed var(--muted); color: var(--muted); border-radius: 6px; padding: 0 5px; margin-left: 6px; }
.check { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--c); background: transparent; font-weight: 700; line-height: 1; color: var(--on-accent); }
.check[aria-pressed="true"] { background: var(--c); }
.empty { border: 1.5px dashed var(--line); border-radius: 14px; padding: 18px; text-align: center; color: var(--muted); }

/* lists, photos, settings */
.panel { display: flex; flex-direction: column; gap: 12px; }
.panel h2 { font-size: 1.3rem; }
.panel h3 { font-size: 1rem; color: var(--muted); }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.ph { position: relative; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; background: var(--surface-2); border: 0; padding: 0; width: 100%; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph .on-photo { position: absolute; right: 5px; top: 5px; padding: 3px 9px; }
.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > label, .field > .lab { font-weight: 700; font-size: .85rem; }
.field input[type="text"], .field input[type="date"], .field input[type="time"], .field textarea {
  width: 100%; min-width: 0; border: 1.5px solid var(--line); background: var(--bg); border-radius: 12px; padding: 9px 11px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: .85rem; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.sw { width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1.5px var(--line); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ink); }

/* overlays */
.modal { display: none; }
.modal.open { display: flex; position: fixed; inset: 0; z-index: 30; background: rgba(30, 18, 30, .5); align-items: flex-end; justify-content: center;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--surface); border-radius: 22px; padding: 16px; width: 100%; max-width: 520px; max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sheet-head h2 { font-size: 1.2rem; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-weight: 700; font-size: .9rem; max-width: calc(100% - 32px); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

@media (min-width: 900px) {
  .cal-layout { grid-template-columns: minmax(0, 1.35fr) minmax(320px, 1fr); align-items: start; }
  .day, .day.open { display: flex; position: sticky; top: 14px; inset: auto; z-index: auto; padding: 0; overflow: visible; background: transparent; }
  .day .close-day { display: none; }
  .modal.open { align-items: center; }
  .day-photo { height: 220px; }
}
@media (prefers-reduced-motion: no-preference) {
  .cell, .chip, .btn, .tabs button { transition: background-color .15s, border-color .15s; }
}
</style>

<div class="app">
  <header class="top">
    <h1 id="cal-name">My Calendar</h1>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </header>
  <main id="view"></main>
</div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast" role="status" hidden></div>
<input class="vh" type="file" id="file-in" accept="image/*" multiple tabindex="-1" aria-label="Add photos">

<script>
(function () {
  'use strict';
  // ---------- small helpers ----------
  const $ = (s) => document.querySelector(s);
  function h(tag, props, ...kids) {
    const e = document.createElement(tag);
    for (const k in props || {}) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat()) {
      if (c == null || c === false) continue;
      e.append(c.nodeType ? c : document.createTextNode(c));
    }
    return e;
  }
  const pad = (n) => String(n).padStart(2, '0');
  const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const fromYmd = (s) => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const todayStr = () => ymd(new Date());
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const longDate = (s) => fromYmd(s).toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
  const shortDate = (s) => fromYmd(s).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
  function niceTime(t) {
    if (!t) return '';
    const p = t.split(':').map(Number), d = new Date(2000, 0, 1, p[0], p[1]);
    return d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  }
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const TYPES = { appt: 'Appointment', task: 'Assignment', rem: 'Reminder', note: 'Note' };
  const REMS = [[0, 'At the time'], [10, '10 min before'], [60, '1 hour before'], [1440, '1 day before'], [4320, '3 days before'], [10080, '1 week before']];
  const remLabel = (m) => (REMS.find((r) => r[0] === m) || [0, m + ' min before'])[1];

  // ---------- storage (this device only until Google is connected) ----------
  function load(key, fallback) {
    try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); } catch (e) { return fallback; }
  }
  function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* keep working in memory */ } }

  const idb = {
    db: null,
    open() {
      return new Promise((res) => {
        try {
          const rq = indexedDB.open('cozy-calendar', 1);
          rq.onupgradeneeded = () => rq.result.createObjectStore('photos', { keyPath: 'id' });
          rq.onsuccess = () => { idb.db = rq.result; res(); };
          rq.onerror = () => res();
        } catch (e) { res(); }
      });
    },
    run(mode, fn) {
      return new Promise((res) => {
        if (!idb.db) return res(null);
        try {
          const tx = idb.db.transaction('photos', mode), rq = fn(tx.objectStore('photos'));
          tx.oncomplete = () => res(rq ? rq.result : null);
          tx.onerror = tx.onabort = () => res(null);
        } catch (e) { res(null); }
      });
    },
    all: () => idb.run('readonly', (s) => s.getAll()),
    put: (rec) => idb.run('readwrite', (s) => s.put(rec)),
    del: (id) => idb.run('readwrite', (s) => s.delete(id))
  };

  // ---------- starter pictures (drawn here, so they work offline) ----------
  function scene(a, b, inner) {
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + a + '"/><stop offset="1" stop-color="' + b + '"/></linearGradient></defs><rect width="400" height="300" fill="url(#g)"/>' + inner + '</svg>';
    return 'data:image/svg+xml,' + encodeURIComponent(svg);
  }
  const cloud = (x, y, s, f) => '<g fill="' + f + '" transform="translate(' + x + ' ' + y + ') scale(' + s + ')"><circle cx="0" cy="0" r="22"/><circle cx="26" cy="-12" r="26"/><circle cx="54" cy="0" r="22"/><rect x="-22" y="0" width="98" height="22" rx="11"/></g>';
  const face = (x, y, c) => '<g fill="' + c + '"><circle cx="' + (x - 16) + '" cy="' + y + '" r="5"/><circle cx="' + (x + 16) + '" cy="' + y + '" r="5"/></g><path d="M' + (x - 8) + ' ' + (y + 10) + ' q8 8 16 0" fill="none" stroke="' + c + '" stroke-width="3" stroke-linecap="round"/><g fill="#ff9db8" opacity=".7"><circle cx="' + (x - 30) + '" cy="' + (y + 10) + '" r="7"/><circle cx="' + (x + 30) + '" cy="' + (y + 10) + '" r="7"/></g>';
  const stars = (pts, f) => pts.map((p) => '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + p[2] + '" fill="' + f + '"/>').join('');
  const petals = (x, y, n, f) => Array.from({ length: n }, (_, i) => '<ellipse cx="' + x + '" cy="' + (y - 52) + '" rx="20" ry="36" fill="' + f + '" transform="rotate(' + (i * 360 / n) + ' ' + x + ' ' + y + ')"/>').join('');
  const STARTERS = [
    { id: 's-moon', name: 'Sleepy moon', src: scene('#3b2f5c', '#7a5c9a', stars([[60, 50, 3], [120, 110, 2], [330, 60, 3], [300, 150, 2], [90, 200, 2], [350, 230, 3], [180, 40, 2]], '#fff6c9') + '<circle cx="200" cy="140" r="70" fill="#fff1b8"/><circle cx="232" cy="118" r="62" fill="#5a457b"/>' + cloud(60, 250, 1.2, '#cdb9ee') + cloud(250, 262, 1.4, '#e3d4fb')) },
    { id: 's-sun', name: 'Sunny clouds', src: scene('#ffd6e6', '#ffeccf', '<circle cx="290" cy="90" r="46" fill="#ffd27a"/>' + cloud(70, 120, 1.3, '#ffffff') + cloud(210, 190, 1.6, '#ffffff') + cloud(40, 250, 1, '#fff5fa')) },
    { id: 's-berry', name: 'Strawberry', src: scene('#c9f0df', '#e9fbe6', '<path d="M200 262 C112 214 100 120 200 104 C300 120 288 214 200 262Z" fill="#ff7a93"/>' + stars([[168, 150, 4], [200, 172, 4], [232, 150, 4], [182, 204, 4], [220, 206, 4], [200, 232, 4]], '#fff3c4') + '<g fill="#5fbf7a"><ellipse cx="170" cy="104" rx="30" ry="13" transform="rotate(-25 170 104)"/><ellipse cx="230" cy="104" rx="30" ry="13" transform="rotate(25 230 104)"/><ellipse cx="200" cy="92" rx="13" ry="26"/></g>' + face(200, 176, '#7a2b3e')) },
    { id: 's-cat', name: 'Peach cat', src: scene('#ffe0cc', '#ffd0d8', '<g fill="#fff7ef"><polygon points="128,120 140,48 196,96"/><polygon points="272,120 260,48 204,96"/><circle cx="200" cy="160" r="88"/></g><g fill="#ffb8c8"><polygon points="142,104 147,68 174,92"/><polygon points="258,104 253,68 226,92"/></g>' + face(200, 156, '#5b4250') + '<g stroke="#5b4250" stroke-width="2.5" stroke-linecap="round"><path d="M120 160h-34M122 174l-30 10M280 160h34M278 174l30 10"/></g>') },
    { id: 's-daisy', name: 'Daisy', src: scene('#fff3c2', '#ffe3d1', petals(200, 150, 10, '#ffffff') + '<circle cx="200" cy="150" r="40" fill="#ffc94d"/>' + face(200, 146, '#7a5320')) },

      h('div', { class: 'field' }, dateLab, h('input', { type: 'date', id: 'ed-date', value: d.date })),

      h('div', { class: 'field' }, h('label', { for: 'ed-notes', text: 'Notes' }), h('textarea', { id: 'ed-notes', rows: '3' }, d.notes)),
      err,
      h('div', { class: 'row', style: 'justify-content:space-between' }, delBtn || h('span', {}), h('button', { class: 'btn primary', type: 'submit' }, 'Save')));
    openModal(form);
    if (!item) $('#ed-title').focus();
  }

  // ---------- render ----------
  const VIEWS = [['cal', 'Calendar', renderCal], ['todo', 'To-do', renderTodo], ['photos', 'Photos', renderPhotos], ['settings', 'Settings', renderSettings]];
  function render() {
    $('#tabs').replaceChildren(...VIEWS.map((v) => h('button', { type: 'button', 'aria-pressed': String(view === v[0]), onclick: () => { view = v[0]; dayOpen = false; render(); } }, v[1])));
    const keep = document.activeElement && document.activeElement.id;
    $('#view').replaceChildren(VIEWS.find((v) => v[0] === view)[2]());
    if (keep === 'set-name') { const el = $('#set-name'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
  }

  applyLook();
  render();
  idb.open().then(() => idb.all()).then((recs) => {
    uploads = (recs || []).filter((r) => r && r.blob).map((r) => ({ id: r.id, url: URL.createObjectURL(r.blob) }));
    if (uploads.length) render();
  });
})();
</script>
